name: Quality

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '*.html'
      - '*.js'
      - '*.css'
      - 'package.json'
      - 'tests/**'
      - '.github/workflows/quality.yml'
  pull_request:
    paths:
      - '*.html'
      - '*.js'
      - '*.css'
      - 'package.json'
      - 'tests/**'
      - '.github/workflows/quality.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - name: Upload visual references
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: level1-visual-reference
          path: screenshots/
          if-no-files-found: ignore
          retention-days: 14
